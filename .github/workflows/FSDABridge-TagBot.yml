name: FSDABridge.jl TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      issues: write # TagBot opens an issue if it cannot tag
      pull-requests: read
    steps:
      - uses: JuliaRegistries/TagBot@a3a48fad3c1d6c2abbb874970a3f9032493a7473 # v1.25.14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          subdir: packages/FSDAjl
          changelog: |
            ## {{ package }} {{ version }}
            {% if yanked %}

            :warning: **This release has been yanked from the registry.**
            {% endif %}
            {% if custom %}

            {{ custom }}
            {% endif %}

            See the [changelog](https://github.com/UniprJRC/FSDA-bridge/blob/{{ sha }}/packages/FSDAjl/CHANGELOG.md) for the changes in this release.
