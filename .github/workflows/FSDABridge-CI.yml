name: FSDABridge.jl CI
on:
  push:
    branches: [main]
    paths: ["packages/FSDAjl/**", ".github/workflows/FSDABridge-CI.yml"]
  pull_request:
    paths: ["packages/FSDAjl/**", ".github/workflows/FSDABridge-CI.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Tests, Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write # lets julia-actions/cache prune its old caches
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: packages/FSDAjl
      - uses: julia-actions/julia-runtest@v1
        with:
          project: packages/FSDAjl

  load-check:
    name: Load check, as AutoMerge does it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - run: |
          env -i HOME="$HOME" PATH="$PATH" JULIA_REGISTRYCI_AUTOMERGE=true PYTHON= \
            JULIA_PKG_PRECOMPILE_AUTO=0 JULIA_DEPOT_PATH="$(mktemp -d):" \
            julia -e 'using Pkg; Pkg.develop(path="packages/FSDAjl"); import FSDABridge'
